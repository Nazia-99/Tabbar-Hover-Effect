<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabbar</title>
<link rel="stylesheet" href="code-with-nazia.css">
</head>
<body>

    <div class="stage">
        <div class="tabbar" id="tabbar">
       
          <div class="tab" data-i="0">
            <div class="ring"></div>
            <svg viewBox="0 0 26 26">
              <linearGradient id="fillGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f97a4d"/>
                <stop offset="1" stop-color="#f5622f"/>
              </linearGradient>
              <g class="outline">
                <path d="M6 12 L8.5 4.5 Q9.2 3 13 3 Q16.8 3 17.5 4.5 L20 12 Q20.6 13.6 18 13.6 Q16 13.6 15 12.4 Q14 13.6 13 13.6 Q12 13.6 11 12.4 Q10 13.6 8 13.6 Q5.4 13.6 6 12 Z"/>
                <rect x="6" y="15.5" width="14" height="7.5" rx="2.6"/>
              </g>
              <g class="filled">
                <path d="M6 12 L8.5 4.5 Q9.2 3 13 3 Q16.8 3 17.5 4.5 L20 12 Q20.6 13.6 18 13.6 Q16 13.6 15 12.4 Q14 13.6 13 13.6 Q12 13.6 11 12.4 Q10 13.6 8 13.6 Q5.4 13.6 6 12 Z"/>
                <rect x="7" y="14.5" width="12" height="7.5" rx="2.6"/>
              </g>
            </svg>
          </div>
       
          <div class="tab" data-i="1">
            <div class="ring"></div>
            <svg viewBox="0 0 26 26">
              <g class="outline">
                <rect x="3.5" y="4" width="19" height="14" rx="3.2"/>
                <path d="M11 8.3 L16 11 L11 13.7 Z" stroke-linejoin="round"/>
                <line x1="9.5" y1="21" x2="16.5" y2="21"/>
              </g>
              <g class="filled">
                <rect x="3.5" y="4" width="19" height="14" rx="3.2"/>
                <path d="M11 8.3 L16 11 L11 13.7 Z" fill="#fff" stroke="none"/>
                <rect x="9.5" y="20" width="7" height="1.6" rx="0.8" stroke="none"/>
              </g>
            </svg>
          </div>
       
          <div class="tab" data-i="2">
            <div class="ring"></div>
            <svg viewBox="0 0 26 26">
              <g class="outline">
                <path d="M4 12.5 L13 4 L22 12.5 L22 20.5 Q22 22 20.5 22 L5.5 22 Q4 22 4 20.5 Z" stroke-linejoin="round"/>
                <path d="M9.8 14.5 Q13 17.3 16.2 14.5" stroke-linecap="round"/>
              </g>
              <g class="filled">
                <path d="M4 12.5 L13 4 L22 12.5 L22 20.5 Q22 22 20.5 22 L5.5 22 Q4 22 4 20.5 Z"/>
                <path d="M9.8 14.5 Q13 17.3 16.2 14.5" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>
              </g>
            </svg>
          </div>
       
          <div class="tab" data-i="3">
            <div class="ring"></div>
            <svg viewBox="0 0 26 26">
              <g class="outline">
                <circle cx="13" cy="13" r="9.5"/>
                <path d="M11 9.3 L17 13 L11 16.7 Z" stroke-linejoin="round"/>
              </g>
              <g class="filled">
                <circle cx="13" cy="13" r="9.5"/>
                <path d="M11 9.3 L17 13 L11 16.7 Z" fill="#fff" stroke="none"/>
              </g>
            </svg>
          </div>
       
          <div class="tab" data-i="4">
            <div class="ring"></div>
            <svg viewBox="0 0 26 26">
              <g class="outline">
                <path d="M13 3.5 C8.5 3.5 7 7 7 10.5 C7 15 9 17.5 9 19.5 L9 21.5 Q9 22.5 10 22.5 L16 22.5 Q17 22.5 17 21.5 L17 19.5 C17 17.5 19 15 19 10.5 C19 7 17.5 3.5 13 3.5 Z"/>
                <circle cx="10.6" cy="11.3" r="0.9" fill="#2b2b33" stroke="none"/>
                <circle cx="15.4" cy="11.3" r="0.9" fill="#2b2b33" stroke="none"/>
              </g>
              <g class="filled">
                <path d="M13 3.5 C8.5 3.5 7 7 7 10.5 C7 15 9 17.5 9 19.5 L9 21.5 Q9 22.5 10 22.5 L16 22.5 Q17 22.5 17 21.5 L17 19.5 C17 17.5 19 15 19 10.5 C19 7 17.5 3.5 13 3.5 Z"/>
                <circle cx="10.6" cy="11.3" r="0.9" fill="#fff" stroke="none"/>
                <circle cx="15.4" cy="11.3" r="0.9" fill="#fff" stroke="none"/>
              </g>
            </svg>
          </div>
       
        </div>
      </div>

<script>
const tabs = Array.from(document.querySelectorAll('.tab'));
const timers = new WeakMap();

function clearTimers(t){
  const ids = timers.get(t);
  if(ids){ ids.forEach(clearTimeout); }
  timers.set(t, []);
}

function activate(t){
  clearTimers(t);
  t.classList.remove('active','sweeping','activating');
  t.querySelector('.ring').style.opacity = 0;
  // force reflow so the ring/punch animations can restart
  void t.offsetWidth;
  t.classList.add('ringing','activating');

  const id1 = setTimeout(()=>{
    t.classList.remove('ringing');
    t.querySelector('.ring').style.opacity = 0;
    t.classList.add('sweeping');
    const id2 = setTimeout(()=>{
      t.classList.remove('sweeping');
      t.classList.add('active');
    }, 500);
    const id3 = setTimeout(()=>{
      t.classList.remove('activating');
    }, 500);
    timers.set(t, [id2, id3]);
  }, 550);
  timers.set(t, [id1]);
}

function deactivate(t){
  clearTimers(t);
  t.classList.remove('ringing','sweeping','active','activating');
  t.querySelector('.ring').style.opacity = 0;
}

tabs.forEach(t=>{
  t.addEventListener('mouseenter', ()=> activate(t));
  t.addEventListener('mouseleave', ()=> deactivate(t));
  t.addEventListener('touchstart', (e)=>{ e.preventDefault(); activate(t); }, {passive:false});
  t.addEventListener('touchend', ()=> deactivate(t));
});
</script>
</body>
</html>
